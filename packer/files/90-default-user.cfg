# From the Packer template (LINDS-Terraform packer/files/90-default-user.cfg).
#
# The default account of a clone is `jayden`, which the template already has.
# Without this file cloud-init makes a second account, `ubuntu`, with sudo
# and no SSH key, on every clone. The SSH keys that Terraform gives a clone
# (initialization.user_account) now go to `jayden`.
system_info:
  default_user:
    name: jayden
    lock_passwd: true
    gecos: Jayden
    groups: [adm, sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash

# SSH logins use a key only.
ssh_pwauth: false
