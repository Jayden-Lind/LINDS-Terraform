# From the Packer template (LINDS-Terraform packer/files/01-hardening.conf). LINDS-Ansible
# roles/common installs the same file on the hosts that it manages.
# sshd uses the first value that it reads. This file is before
# 50-cloud-init.conf, which permits passwords on a clone of the template.
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
# root logs in with a key only.
PermitRootLogin prohibit-password
X11Forwarding no
LoginGraceTime 30
